<!DOCTYPE html>
<!-- idea-to-app 交付物样板：单文件、双击可用、无需网络。
     开发工程师以此为起点定制：① 把 :root 里的令牌值换成 02-设计方案「设计令牌」节的取值（一律改令牌，不在页面写裸值）；
     ② 改标题/文案/功能，保留"数据保存 + 备份/恢复"骨架。
     约定：有用户数据的应用必须保留"导出备份"和"恢复"功能（质量底线，G3 会机器检查）。
     本样板的默认取值 = design-craft.md 演示色板（暖棕），只是占位——必须换成 02 定的值。

     体感与交互的标准写法（照抄这套模式，别退回坏习惯）：
     - 事件绑定全部 addEventListener / 事件委托，禁止在 innerHTML 里拼 onclick（逻辑混乱之源）；
     - 删除走"撤销提示条"（5 秒内可恢复），不用系统 confirm()——confirm/alert/prompt 禁止作为正式交互；
     - 反馈一律页面内 toast + 状态变化，点击先出反馈态再干活；
     - 新增行高亮渐隐、完成态切换有过渡；详见 tech-recipes「体感与交互工艺」节。 -->
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的小助手</title>
<style>
  /* ===== 设计令牌（唯一改色/改形/改节奏的地方，照 02「设计令牌」节换值） ===== */
  :root {
    /* 色彩 16 语义位（灰阶随主色染色；每对前景/背景对比度 ≥ 4.5:1） */
    --c-primary: #92400E;        --c-on-primary: #FFFFFF;
    --c-secondary: #B45309;      --c-on-secondary: #FFFFFF;
    --c-accent: #C2410C;         --c-on-accent: #FFFFFF;
    --c-bg: #FFF7ED;             --c-fg: #3D2B1F;
    --c-card: #FFFFFF;           --c-card-fg: #3D2B1F;
    --c-muted: #F3E7D8;          --c-muted-fg: #8A6D55;
    --c-border: #EEDDC8;
    --c-danger: #DC2626;         --c-on-danger: #FFFFFF;
    --c-ring: #92400E;
    /* 字体：正文栈 + 字重层级（700/500/400）+ 字阶 */
    --font-body: -apple-system, "PingFang SC", "HarmonyOS Sans SC", "MiSans", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    --fs-sm: 14px; --fs-base: 16px; --fs-md: 20px; --fs-lg: 25px;
    /* 间距（标准档）与形状 */
    --sp-1: 8px; --sp-2: 16px; --sp-3: 24px; --sp-4: 32px;
    --radius: 12px;
    /* 深度阶梯（全站只用这几档） */
    --shadow-el-1: 0 1px 3px rgba(61, 43, 31, .10);
    --shadow-el-2: 0 4px 6px rgba(61, 43, 31, .10);
    --shadow-el-4: 0 20px 40px rgba(61, 43, 31, .15);
    /* 动效（克制档：只留交互反馈） */
    --dur-fast: 120ms; --dur-base: 200ms;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-body);
    font-size: var(--fs-base); line-height: 1.65;
    background: var(--c-bg); color: var(--c-fg);
    max-width: 640px; margin: 0 auto; padding: var(--sp-2);
  }
  /* 键盘焦点可见（可访问性底线） */
  :focus-visible { outline: 3px solid var(--c-ring); outline-offset: 2px; border-radius: 4px; }

  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--sp-2); }
  h1 { font-size: var(--fs-lg); font-weight: 700; }

  /* 按钮五态：默认/悬停/按下/禁用/小号——一屏只有一个实心主按钮 */
  .btn {
    display: inline-block; border: none; border-radius: var(--radius); cursor: pointer;
    padding: 12px 20px; font-size: var(--fs-base); font-weight: 500; font-family: inherit;
    background: var(--c-primary); color: var(--c-on-primary);
    transition: transform var(--dur-fast) ease-out, filter var(--dur-fast) ease-out, opacity var(--dur-fast) ease-out;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: scale(0.97); filter: brightness(0.94); }   /* 按压反馈 ≤150ms */
  .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
  .btn.green { background: var(--c-accent); color: var(--c-on-accent); }
  .btn.ghost { background: var(--c-card); color: var(--c-primary); border: 1px solid var(--c-border); }
  .btn.small { padding: 8px 14px; font-size: var(--fs-sm); }

  /* 卡片 = el-1 深度 + 边框（浅色主题最稳的分层配方） */
  .card {
    background: var(--c-card); color: var(--c-card-fg);
    border: 1px solid var(--c-border); border-radius: var(--radius);
    padding: var(--sp-2); margin-bottom: var(--sp-2); box-shadow: var(--shadow-el-1);
  }
  .item { display: flex; justify-content: space-between; align-items: center; padding: 12px 4px; border-bottom: 1px solid var(--c-border); }
  .item:last-child { border-bottom: none; }
  .item .main { font-size: var(--fs-md); font-weight: 500; transition: opacity var(--dur-base) ease-out; }
  .item.done .main { color: var(--c-muted-fg); text-decoration: line-through; }
  /* 新增行高亮渐隐（完成反馈之一） */
  .item.fresh { animation: fresh-in 1.6s ease-out 1; }
  @keyframes fresh-in { 0%, 40% { background: var(--c-muted); } 100% { background: transparent; } }
  .empty { text-align: center; color: var(--c-muted-fg); padding: var(--sp-3) 0; }
  form { display: flex; gap: var(--sp-1); flex-wrap: wrap; }
  label { display:block; font-size: var(--fs-sm); font-weight: 500; color: var(--c-muted-fg); margin-bottom: 4px; }
  input, select {
    font-size: var(--fs-base); font-family: inherit; padding: 10px;
    border: 1px solid var(--c-border); border-radius: var(--radius); flex: 1; min-width: 120px;
    background: var(--c-card); color: var(--c-fg);
  }
  .tip { color: var(--c-muted-fg); font-size: var(--fs-sm); margin-top: var(--sp-1); }
  /* 数字/金额列对齐（账目类必开） */
  .num { font-variant-numeric: tabular-nums; }

  /* toast：页面内反馈（el-4），替代 alert；带撤销按钮时用户 5 秒内可反悔 */
  .toast {
    position: fixed; left: 50%; bottom: calc(var(--sp-3) + env(safe-area-inset-bottom));
    transform: translateX(-50%); z-index: 30;
    display: flex; align-items: center; gap: var(--sp-2);
    background: var(--c-fg); color: var(--c-bg);
    padding: 10px 16px; border-radius: var(--radius); box-shadow: var(--shadow-el-4);
    font-size: var(--fs-sm); max-width: 92vw;
    animation: toast-in var(--dur-base) ease-out;
  }
  .toast.err { background: var(--c-danger); color: var(--c-on-danger); }
  .toast button {
    border: none; background: var(--c-bg); color: var(--c-fg);
    border-radius: 8px; padding: 4px 12px; font-weight: 500; cursor: pointer; font-size: var(--fs-sm);
  }
  .toast.err button { background: var(--c-on-danger); color: var(--c-danger); }
  @keyframes toast-in { from { opacity: 0; transform: translate(-50%, 8px); } }

  /* 加载骨架：形状 = 内容形状，不用孤零零转圈 */
  .skeleton { border-radius: 6px; background: var(--c-muted); position: relative; overflow: hidden; min-height: 1.2em; }
  .skeleton::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%);
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.5), transparent);
    animation: shimmer 1.2s infinite; }
  @keyframes shimmer { to { transform: translateX(100%); } }

  /* 动效兜底：系统开了"减少动态效果"就全部关掉 */
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<header>
  <h1 id="app-title">我的小助手</h1>
  <button class="btn small ghost" id="btn-export">导出备份</button>
</header>

<!-- 空状态：一句温度话 + 一个明确的下一步 -->
<div class="card" id="empty-box" style="display:none">
  <div class="empty">这里还是空的，先从下面添加一条吧</div>
</div>

<div class="card" id="list-box" aria-live="polite"></div>

<div class="card">
  <form id="add-form">
    <div style="flex:2; min-width: 160px;">
      <label for="inp-text">记点什么</label>
      <input id="inp-text" type="text" placeholder="例如：周三交物业费" required>
    </div>
    <button class="btn" type="submit">添加</button>
  </form>
  <div class="tip">数据自动保存在电脑里，关掉再打开还在。重要的话点右上角"导出备份"。</div>
</div>

<div class="card">
  <button class="btn green" id="btn-restore">恢复备份</button>
  <input id="restore-file" type="file" accept=".json" style="display:none">
</div>

<script>
/* ================= 数据层（唯一事实源，保留此骨架，勿删） =================
   逻辑纪律：items 是唯一的状态存放处，DOM 只是它的投影；
   事件 → 改 items → save() → render()，单向流动，渲染出口唯一。 */
const KEY = "my-app-data";   // 改成你的应用专属 key
let items = JSON.parse(localStorage.getItem(KEY) || "[]");

function save() { localStorage.setItem(KEY, JSON.stringify(items)); }

function render(freshIndex = -1) {
  const list = document.getElementById("list-box");
  document.getElementById("empty-box").style.display = items.length ? "none" : "";
  list.innerHTML = items.map((it, i) => `
    <div class="item ${it.done ? "done" : ""} ${i === freshIndex ? "fresh" : ""}">
      <span class="main"></span>
      <span>
        <button class="btn small ${it.done ? "ghost" : "green"}" data-act="done" data-i="${i}">${it.done ? "已完成" : "完成"}</button>
        <button class="btn small ghost" data-act="del" data-i="${i}">删除</button>
      </span>
    </div>`).join("");
  /* 文本走 textContent 安全写入，不拼进 innerHTML（防注入 + 教学示范） */
  list.querySelectorAll(".item").forEach((el, i) => { el.querySelector(".main").textContent = items[i].text; });
}

/* ================= toast：页面内反馈（替代 alert）+ 撤销 ================= */
let toastTimer = null;
function toast(msg, { type = "", undo = null, undoLabel = "撤销", ms = 5000 } = {}) {
  document.getElementById("toast")?.remove();
  clearTimeout(toastTimer);
  const box = document.createElement("div");
  box.id = "toast"; box.className = "toast " + type; box.setAttribute("role", "status");
  box.textContent = msg;
  if (undo) {
    const btn = document.createElement("button");
    btn.type = "button"; btn.textContent = undoLabel;
    btn.addEventListener("click", () => { box.remove(); clearTimeout(toastTimer); undo(); });
    box.appendChild(btn);
  }
  document.body.appendChild(box);
  toastTimer = setTimeout(() => box.remove(), ms);
}

/* ================= 交互层：事件绑定全在 JS，innerHTML 里不拼 onclick ================= */
document.getElementById("add-form").addEventListener("submit", e => {
  e.preventDefault();
  const inp = document.getElementById("inp-text");
  items.push({ text: inp.value.trim(), done: false, at: new Date().toISOString() });
  inp.value = ""; save(); render(items.length - 1);      // 新行高亮 = 完成反馈
});

/* 列表操作用事件委托：一处分发，按 data-act 路由 */
document.getElementById("list-box").addEventListener("click", e => {
  const btn = e.target.closest("button[data-act]");
  if (!btn) return;
  const i = Number(btn.dataset.i);
  if (btn.dataset.act === "done") { items[i].done = !items[i].done; save(); render(); }
  if (btn.dataset.act === "del") {
    const [removed] = items.splice(i, 1); save(); render();
    toast(`已删除「${removed.text}」`, { undo: () => {            // 删除 = 撤销优先，不弹 confirm
      items.splice(i, 0, removed); save(); render(); toast("已恢复");
    } });
  }
});

/* 备份/恢复：导出 JSON 文件（质量底线，G3 机器检查"导出/备份"字样） */
document.getElementById("btn-export").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(items, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "我的数据备份-" + new Date().toISOString().slice(0, 10) + ".json";
  a.click(); URL.revokeObjectURL(a.href);
  toast("备份已下载，请妥善保存");
});
document.getElementById("btn-restore").addEventListener("click", () =>
  document.getElementById("restore-file").click());
document.getElementById("restore-file").addEventListener("change", e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      if (!Array.isArray(data)) throw 0;
      items = data; save(); render(); toast("恢复完成！");
    } catch { toast("这个备份文件读不出来，请确认选对了文件", { type: "err", ms: 8000 }); }
  };
  r.readAsText(f);
});

document.getElementById("app-title").textContent = document.title;
render();
</script>
</body>
</html>
